[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mastercyx-retrycap"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出智能体的重试上限设计上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mastercyx" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mastercyx.github.io"
Repository = "https://github.com/mastercyx/retrycap"
Issues = "https://github.com/mastercyx/retrycap/issues"

[project.scripts]
retrycap = "retrycap:main"

[tool.setuptools]
py-modules = ["retrycap"]
